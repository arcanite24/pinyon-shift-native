# --- Textures and models ----------------------------------------------------

[[finding]]
group = """Textures and models"""
base = """.xds"""
v4 = """same"""
name = """XDS texture header"""
what = """An `.xds` texture is a `0x34`-byte (52-byte) header, first u32 = 3, holding a Xenos texture fetch constant at `0x1C` (format, width and height, pitch, tiling, endianness, swizzle, mip count, packed mips), followed by the texture data. A base level no larger than 16 texels sits in the packed mip tail. The data is the base level, then each mip level in its own region of 32x32-block tiles rounded up to 4 KB (row pitch from the size rounded to a power of two), the levels whose shorter side is 16 texels or less sharing one packed tile at the end; every block is byte-swapped by the endian mode (8-in-16 on the cars). This accounts for every byte of the data, tile padding included."""
how = """`inspect-fh1-ui.py` decodes every UI texture; uncompressed textures re-encode to the stored bytes. `tools/fh1_xds.py` reads every level's blocks and writes them back into an all-zero texture, which gives the stored file byte for byte for all 698 body atlases (`nodamage`, `damage`, with and without `_LOD0`) of the 176 base cars and for all 154 Autoshow pictures in `ui/Textures.zip` (768x288 `k_8_8_8_8`, endian 2, where each "block" is one texel, stored B, G, R, A after the swap) (#496 phase 2, 2026-11-06)."""
confidence = """confirmed"""
source = """tools/inspect-fh1-ui.py parse_xds, decode_xds; docs/UI_ASSETS.md; branch feat/ac-car-inspect tools/fh1_xds.py layout; docs/formats/CARS.md"""

