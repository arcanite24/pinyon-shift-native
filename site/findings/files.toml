[[finding]]
group = """Other formats"""
base = """media/**/*.wmv, *.fsb"""
name = """movies and sound samples decode with stock FFmpeg"""
what = """All 12 movies (9 on the disc, 3 in the DLC) are WMV9 (`wmv3`) video at 1280x720 and about 30 fps with `wmapro` audio (`MSGS_Logo` uses `wmav2`), and stock FFmpeg 8.1.1 decodes every frame of each; `Forza_Tone.wmv` reports three corrupt frames and still decodes to the end. The loose FSB4 banks hold XMA and MPEG samples only (no PCM16, no XMA sample above two channels): car engine banks are all XMA (13,080 samples), radio all MPEG (2,271), speech mostly MPEG. Stock FFmpeg decodes the XMA samples once each is wrapped as a RIFF XMA2 stream (format 0x166, 2048-byte packets), to exactly the length the sample header gives; its output starts 384 frames later than the SDK decoder's. Short radio MPEG samples with padding between frames need the padding removed first, as tools/fh1_audio_decode.cpp does. So a native engine can transcode movies and samples at install time with FFmpeg alone."""
how = """tools/re/media-decode-check.py (RI-0.6, 2026-11-19): every .wmv decoded to null; 299 samples from 5 banks per category and codec decoded with the project's decoder and with FFmpeg, compared by SNR (XMA 57-65 dB, MPEG 67-80 dB). The SDK decoder is itself libavcodec's, so the XMA agreement is not independent; the exact lengths and zero errors are the evidence. The 69 FSBs inside archives were not decoded."""
confidence = """confirmed"""
source = """docs/REIMPLEMENTATION_PLAN.md RI-0.6"""

