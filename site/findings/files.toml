[[finding]]
group = """Archives"""
id = """compression-methods"""
name = """compression methods in use"""
what = """99.3 % of archive members (257,122) use method 21, the Xbox XMem LZX codec; 1,415 are stored (method 0) and 399 deflated (method 8). All but 329 members carry extra field `0x1123`, which the game reads for the absolute payload offset. The XMem LZX streams need a 128 KiB window: none decodes with 64 KiB. Decoded with libmspack, 258,521 of 258,537 members (every one but the 399 deflated) match their CRC-32, 231,270 of them without a local header; 16 fail with every window size although their frames look well formed (10 development JPEGs in `UI.zip`, two `.pgeo`, four `.gr2`)."""
