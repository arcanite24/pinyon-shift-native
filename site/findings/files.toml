v4 = """same"""
name = """carbin vertex (28 bytes)"""
what = """Big-endian: the position as a direction and a length, four int16: a unit vector (x, y, z over 32767) and its length over 32767 as a fraction of the length of the part's half-extent vector, so position = (x, y, z) / 32767 x w / 32767 x |half-extent| + offset; UV0 and UV1 as two uint16 over 65535 each, before the sub-section's UV offset and scale; a tangent frame as a unit quaternion of four int16 over 32767, stored (x, y, z, w), that turns +X to the normal, +Y to the tangent along U (dP/du) and -Z to dP/dv (the sign of w is not handedness: the base cars store both signs); four bytes of baked lighting: the first behaves as ambient occlusion (about 100 on faces open to the sky, about 60 under the car) and the other three are a signed vector that follows (-ny, nz, -nx) of the normal at a length of about 90, which looks like a bent normal."""
