note = """Twelve CAFF textures are not powers of two (ten 768 wide, one 255 x 256, one 7 x 256); their level counts match the stated sizes, so these are not misreads. Three CAFF textures (_0x00000D9D, _0x00001A09, _0x00002A9D: 256 x 256, one level, a 196,604-byte payload) do not fit and are not decoded. The gamma reading of the sign bits is by the published format layout and by which textures carry it (probable)."""
