what = """`.bix`: a 28-byte big-endian header (BIX1, width, height, levels, D3DFORMAT word, total size, base size) then the mip chain (levels 1 and up and the packed tail); the `_B.bix` twin is the base level, headerless, exactly the base size, streamed separately (the frame binds 109 textures at half size from the chain alone). CAFF `.bin`: format word at 0x1A8, u16 width and height at 0x1B4, u8 level count at 0x1C0 in the `.data` section, texels from 0x2B0. Formats: DXT1 (5,086 .bix, 2,953 CAFF), DXT5 (105, 9), DXN (41), DXT3 (2); format-word sign bits 9-14 all 3 (gamma, sample as sRGB) on 3,811 .bix and 787 CAFF, which are the colour textures. The tiled layout is the .xds one (CARS.md) except that the last region (the tail, or the last level when the chain ends first) is only as large as the tiled bytes it holds, rounded to 4,096, and a .bix base is its _B size. All 5,234 .bix pairs and 2,962 of 2,965 CAFF textures fit to the byte; decoded levels are consistent pictures. Light_Map slots name an all-zero texture in 9,661 of 17,386 uses."""
