group = """Textures and models"""
id = """pvsz-placements"""
base = """media/tracks/colorado/bin.zip __R00ZNNNNN.pvsz"""
name = """.pvsz zone files hold object placements with a half-float rotation"""
what = """A .pvsz starts with a u32 count n and n u32 object IDs (top bit a flag), then a block not decoded (visibility data, presumably), then exactly n placement records that run to the end of the file, record k for ID k. Several starts can chain to the end of the file; the right one has the most rigid rotations (the first such start is wrong in some zones and gives 1,570 records that disagree with the same object's record in another zone; found by the implementation; reproduced here as 56 of the 1,434 zones and 502 objects, none with the most-rigid rule, and no zone has two fully rigid starts). The nine rotation halves are the file-frame rotation's columns with the third component negated: R[r][c] = h[3c+r]·F[r], F = diag(1, 1, -1), checked on all 107 drawn placements including 16 tilted ones (error 0.0005; the row reading errs by up to 0.16). A zone often lists one object per LOD level of a prop at one spot. A record is three half floats (100, 250, 500 in the samples; LOD or fade distances, a guess; NaN, -1 and 0 also occur), the position (three big-endian f32, game frame), nine big-endian half floats holding the game-frame rotation transposed, 16 bytes (zero in the samples) and a flag byte; flag 1 adds a u32 (-1 or a small index that is the same for every placement of one model, perhaps a physics or smashable type), a byte count c, c bytes and a 32-byte name. Records are 53 bytes with flag 0, otherwise 58 + c + 32. The IDs are object (instance) IDs: an object listed by several zones has the same record in each, and its model comes from the object table in the ribbon's .pvs (see pvs-object-table). All 1,434 zones frame (1,027,743 records, 59,599 distinct objects of 0-62,172). 107 of the 130 placements of a free-roam frame (benches, information points, flags, signs, barriers) are records of this kind, none of them also in a .pgeo; 59 of the 107 are also in Ribbon_00/CollObjs.xml (see world placements)."""
how = """Search of all 1,434 zone files for the xyw placements of one frame dump, position within 1 cm and rotation within half-float precision; the framing found as the start, among those whose n records end exactly at the end of the file, with the most rigid rotations, and every one of the 107 matched placements is a record start (world-geometry.py read_pvsz, match-dump --pgeo). RF-7 and RI-0.4, 2026-11-19."""
confidence = """confirmed"""
note = """Free-roam selection (2026-11-20, engine question Q4): the flag-1 bytes are a route list (each byte a TrackRoute number, probable: 81 of 83 distinct values are TrackRoute file numbers, and the event dressing at the reference camera carries routes 134 and 210, whose start locations are 18 and 20 m away) and the 32-byte name is a GameObjs.xml GameplayID (all 1,959 distinct names). A record is shown in free roam when it has no list (flag 0, or c = 0) or the list holds 0: 35,672 objects have no list, 3,954 hold 0 and 19,973 hold other routes only. Of the zone __R00Z01063 spots that project into the reference frame within 470 m, 70 are drawn and shown and 136 neither, with no exception once the Temp_Arrow_Pointer marker (FR06_NODE, list {0}, the striped box the engine drew; all 112 *_NODE objects use that model) is also left out (a guess from one marker in view); at any distance 13 shown spots beyond 470 m are not drawn, unexplained. Zone 01093 also lists all drawn objects but adds 29 shown spots, the union of all zones 53; the camera-to-zone lookup (PVSZLookup_00.dat) is not decoded. Negative results: the top bit of the zone's object ID does not separate drawn from undrawn records, and the third leading half float is not a draw limit (48 drawn objects lie beyond it). The framing and position/rotation are confirmed; the three leading half floats, the 16 bytes, the flag-1 u32 and the block between the ID list and the records are not decoded. The record start is found by search because the block's size is not decoded. Corrected 2026-11-19: the first-start rule and the ambiguous "H = F·R_gameᵀ" rotation wording were wrong or unclear."""
source = """docs/formats/WORLD_GEOMETRY.md#pvsz-zone-files; docs/formats/WORLD_GEOMETRY.md#which-placements-free-roam-draws-engine-question-q4; tools/re/world-geometry.py read_pvsz, prop-selection"""

[[finding]]
group = """Textures and models"""
id = """pvs-object-table"""
base = """media/tracks/colorado/Ribbon_00/Colorado_00.pvs"""
name = """The ribbon .pvs object table names each object's render model"""
what = """Colorado_00.pvs (magic FPVS, version 50; header: a list of 33 u32 at +0x24 that are the first bin.zip directory entries of the 33 repeated member runs, probable, and at +0xAF the u32 count of the 28-byte records, which follow at +0xB3) holds, after a 28-byte-record table and a list of 173 shader names (u32 count, then u32-length-prefixed strings), a u32 count of 62,173 and one 18-byte record per object ID. The record's first big-endian u16 is the member number of the object's render model (coloradoout.NNNNN.rmb.bin). For an object with LODs it names one member of the set (not always LOD00), and the set is the run of consecutive members whose names differ only in a counting _LODnn part. The other fields (a signed u16, two flag-like u16, a u32 that is 0 or an index, a u32 that is -1 or a small count, a u16 that is usually 0xFFFF) are not decoded. The table covers both placement stores: .pvsz object IDs and the .pgeo model records' ID lists (the 291 .pgeo IDs at the top of the range, 0xF1BA-0xF2DC, are objects whose instances the tile places). Of the 130 main-view placements of a free-roam frame, the table names the drawn model for 88 .pvsz and all 23 .pgeo placements, a model of the same LOD set for 8, and a model with a byte-identical mesh for the other 11 (the dump cannot tell such twins apart, and the tie takes the lower member number)."""
how = """The u32 62,173, the size of the object ID space, sits once in the file right after the shader names; the records then line up with the known ID-to-model pairs (fence ID 0xF293 to 05122, 0x5F25 to 05319, 0xC1F3 to 06548 and others) and the 62,173 records end where the section of clustered boxes begins. Checked against every main-view placement of one frame dump (world-geometry.py match-dump --pgeo; dump-obj --props places from it). RI-0.4, 2026-11-19."""
confidence = """confirmed"""
note = """The LOD-set rule is probable. The 28-byte records before the shader names: a u32 count of 19,613, then records of a u32 that increases with gaps, the u32 record number, two f32 (1.0 in every record), 10 zero bytes, a flag byte and a type byte whose counts match the texture members (5,234 type 4, the .bix pairs; 2,965 type 0, the _0x*.bin containers; 11,409 type 1; 5 type 3); the first u32 is the texture ID, the member's hex name (`_0x<ID>.bix`/`_B.bix` for type 4, `_0x<ID>.bin` for type 0; see world-texture-lists). Corrected 2026-11-20: this note said the records' link to file names was not found. The .pgeo reference keys (about 0x4C82-0x4C91) fall in that table's index range; not checked further."""
source = """docs/formats/WORLD_GEOMETRY.md#object-table; tools/re/world-geometry.py read_object_models"""

[[finding]]
group = """Textures and models"""
id = """model-id-space-negatives"""
base = """media/tracks/colorado/bin.zip"""
name = """What the placement model IDs are not"""
what = """The u32 model IDs in .pgeo model records and .pvsz lists are not FilenameMap_00.dat indices (the fence and pine IDs; and for the 58 distinct render models a frame drew from .pvsz placements, none of their filename-map indices is in their zone's leading ID list, whose values run past the map's 43,546 names), not member numbers or CRC-32/FNV-1/FNV-1a hashes of member names, and not a rank of the local-space members by member number, filename-map position, first appearance in the bin.zip directory or object name (no constant offset over the 53 IDs a model box links to a single member). The 291 distinct .pgeo IDs fill 0xF1BA-0xF2DC exactly, and a model record's per-LOD lists hold consecutive IDs (lists 0, 1 and 2 of one record are ID n, n+1, n+2), so they looked like indices into a dense table of model LODs; they are object IDs, and the dense table is the object table in Colorado_00.pvs (pvs-object-table). They are not bin.zip directory indices and not Colorado_00.pvs 28-byte record numbers offset by the 43,546 names. No render model member holds its own object IDs (big- or little-endian u32 or u16), a scan of the loose Colorado and Ribbon_00 files for a fixed-stride table indexed by object ID found only false hits (the object table's 18-byte stride was not among the strides tried), the flag-1 u32 of a .pvsz record is not a model number, and the `_0x*` members are textures. The 14,560 oriented boxes with ID lists in Colorado_00.pvs are not instances (they are per-model effect and texture lists, world-texture-lists; the earlier "clusters" reading was wrong). The trailing 40-byte .pgeo records are packed bitfields, not positions. A free-roam file-open log showed only colorado_00.pvs and bin.zip opened for the track during the logged span."""
how = """Index tests on the fence and pine IDs against each table; byte look at the PVS boxes and the 40-byte records; fh1_render_test_log_file_opens on a free-roam route (RF-7, 2026-11-19). Byte search of every render model for its IDs; a table scan of the loose files (strides 1, 2, 4, 6, 8, 12, 16, 20, 24, 28, 32, 36, 40, 48 and 64; entry sizes 1, 2 and 4) that keeps entries equal for IDs of one model and different for IDs of different models (RI-0.4, 2026-11-19)."""
confidence = """probable"""
negative = true
note = """Resolved 2026-11-19: the IDs are object IDs and the Colorado_00.pvs object table names their models (pvs-object-table). The negatives stay so the dead ends are not retried."""
source = """docs/formats/WORLD_GEOMETRY.md#ruled-out"""
