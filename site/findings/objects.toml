name = """tyre force construction"""
what = """The tyre model turns slip into force through the compound's two `List_TireFrictionMultiCurve` rows (longitudinal and lateral). Each row's two `List_TireFrictionCurve` curves are read at the combined normalised slip and blended linearly by the wheel load in kilograms-force between `MinLoadCurve` and `MaxLoadCurve`. Slip ratio and slip angle are each divided by their load-blended peak slip (the slip of the curve's largest sample), and the peak slips and the curve's slip axis are both stretched by a sidewall factor from `PhysicsSettings.ini` `SidewallScalePeakSA` at the tyre's sidewall height (width × aspect; 1.27 on the stock R34). The force in each direction is the curve value × that direction's share of the combined slip × the load × the scales: surface friction, the `List_UpgradeCarBodyChassisStiffness` lat/long scales (wheel+0x60, +0x64), a compound drive scale (wheel+0x68, 1.15 on the R34 above 15 m/s), a scale near 1 (wheel+0x6C, 1.01) and the affect curves. The curve values land at wheel+0x8C (lateral) and +0x90 (longitudinal), the forces at +0x1BC and +0x1D4. `List_TireFrictionCurve.FrictionScale` is not applied. Negative result: the same construction over-predicts the traced lateral value by 7 to 11 %, so the lateral path has a term not identified yet."""
how = """Data flow of the tyre function (what it reads and writes, not transcribed) checked against oracle traces of the stock R34 (ri05-aa2, m3-seg-a): the longitudinal curve value matched within 1 % at four slips and the force exactly; three lateral points read 0.907 to 0.930 of the prediction."""
confidence = """probable"""
note = """Longitudinal confirmed on one car; the lateral gap and the `FrictionScale` omission need a second compound to rule out a coincidence."""
source = """docs/specs/CAR_PHYSICS.md"""

