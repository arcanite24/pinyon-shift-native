[[finding]]
group = """Car dynamics"""
base = """List_SpringDamperPhysics, List_UpgradeCarBodyWeight"""
name = """suspension rates per mass, inertia as a box"""
what = """The car build multiplies the `List_SpringDamperPhysics` rates (`DefSpringRate`, `DefDampenBumpRate`, `DefDampenReboundRate`, `DampenBumpClamp`, `DampenReboundClamp`) by the car's mass: the spring rate at wheel+0x33C is the column × body mass (15.6 for 1,560 kg) in 100 N/m, and bump, rebound and the two clamps at +0x340 to +0x34C scale the same way. The body inertia is the mass as a solid box of `BlockDimX`, `BlockDimY`, `BlockDimZ` (m/12 × the sum of the other two dimensions squared): the world inertia at body+0x10 rotated into the body frame is diagonal and equals the three box values. body+0xA0 is probably the angular momentum, not the angular velocity: its vertical part divided by the yaw inertia matches the course rate of a full-lock circle within 1 % (one axis checked)."""
how = """Oracle traces of the stock R34 (ri05-aa1, ri05-aa2, m3-steer-1) against the merged database rows."""
confidence = """confirmed"""
note = """The anti-roll bar rate was not checked against `List_AntiSwayPhysics`."""
source = """docs/specs/CAR_PHYSICS.md"""

[[finding]]
group = """Car dynamics"""
base = """CCarDynamics +2240, +3904, +3932"""
name = """launch, shift and steering timing (stock R34)"""
what = """Measured with the seed's assists (automatic gears, traction control off): from rest at full throttle the clutch slips for about 0.55 s while the engine revs from idle to about 5,800 rpm; the box shifts up at about 0.96 × `RedlineRPM` (1→2 at 7,690 rpm, 67.8 km/h), and a shift takes 0.60 to 0.66 s from the shift state at +3932 changing to power back, about `ClutchInTime` + `GearShiftTime` + `ClutchOutTime`. Under braking it shifts down, and with the brake held at low speed it selects reverse (gear 0) before the stop. At walking pace the steer control steps straight to the stick, the yaw builds over 0.40 s (`SteerMaxAngle` / `SteerMaxAngVelTurning`) and the full-lock path radius, 3.37 m, gives a road-wheel angle of `SteerMaxAngle` within 1°. Full brake from 80 km/h: the wheels lock within 0.25 s and the ABS holds them, mean deceleration 8.57 m/s² in two runs."""
how = """Oracle body traces of three routes (m3-seg-a, m3-seg-b1, m3-seg-b2: launch and brake; m3-steer-1: full lock at walking pace)."""
confidence = """probable"""
note = """One car; steering at speed and the assisted steering not traced."""
source = """docs/specs/CAR_PHYSICS.md"""
