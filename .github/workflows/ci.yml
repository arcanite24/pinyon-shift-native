name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene & docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check clean-room provenance
        run: python3 tools/check-provenance.py
      - name: Validate Android manifest and Java sources
        run: python3 tools/android-apk.py --validate-only
      - name: Self-test benchmark runner
        run: python3 tools/benchmark.py --self-test
      - name: Build docs site and verify internal links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/build.py --out "$RUNNER_TEMP/site"

  windows:
    name: Windows (MSVC Release)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure Ninja is available
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja
          }
      - name: Configure and build (Release)
        shell: powershell
        run: .\tools\build-windows.ps1 -BuildDir build -Config Release -NoLtcg
      - name: Run unit tests
        shell: powershell
        run: ctest --test-dir build -LE corpus --output-on-failure -j 4
      - name: Run RHI backend & parity tests
        shell: powershell
        run: ctest --test-dir build -R "^(rhi_tests|rhi_dx12_tests|rhi_parity_tests)$" --output-on-failure -V
      - name: Self-test benchmark runner
        shell: powershell
        run: python tools/benchmark.py --self-test

  linux:
    name: Linux (GCC Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check shader portability manifest (Vulkan 1.3 / Metal 3 / DX12)
        run: python3 tools/check-shader-portability.py --check-manifest
      - name: Install build and SDL3 system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Configure (Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build -LE corpus --output-on-failure -j "$(nproc)"

  macos:
    name: macOS (Apple Silicon Release)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja and MoltenVK
        run: brew install ninja molten-vk
      - name: Configure (Release, Metal 3 + Vulkan)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHIFT_RHI_METAL=ON
      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"
      - name: Run unit tests
        run: ctest --test-dir build -LE corpus --output-on-failure -j "$(sysctl -n hw.ncpu)"

  android:
    name: Android (NDK arm64 compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Android manifest and Java sources
        run: python3 tools/android-apk.py --validate-only
      - name: Detect Android NDK toolchain
        id: ndk
        run: |
          NDK_DIR=""
          for cand in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            if [ -n "$cand" ] && [ -f "$cand/build/cmake/android.toolchain.cmake" ]; then
              NDK_DIR="$cand"
              break
            fi
          done
          if [ -z "$NDK_DIR" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            for cand in $(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V -r); do
              if [ -f "$cand/build/cmake/android.toolchain.cmake" ]; then
                NDK_DIR="$cand"
                break
              fi
            done
          fi
          if [ -n "$NDK_DIR" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "dir=$NDK_DIR" >> "$GITHUB_OUTPUT"
            echo "Found Android NDK toolchain at $NDK_DIR"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android NDK not found on runner; skipping NDK CMake compile check."
          fi
      - name: Install CMake and Ninja
        if: steps.ndk.outputs.available == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build
      - name: Configure Android arm64 (NDK Release)
        if: steps.ndk.outputs.available == 'true'
        run: |
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.dir }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DSHIFT_BUILD_LAUNCHER=OFF
      - name: Build Android carview shared library (libmain.so)
        if: steps.ndk.outputs.available == 'true'
        run: |
          cmake --build build-android --target carview -j "$(nproc)"
          test -f build-android/apps/carview/libmain.so
