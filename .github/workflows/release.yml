name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hygiene:
    name: Provenance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check clean-room provenance
        run: python3 tools/check-provenance.py
      - name: Validate Android sources
        run: python3 tools/android-apk.py --validate-only

  windows:
    name: Package Windows (x64)
    needs: [hygiene]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ensure Ninja is available
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja
          }
      - name: Build Release
        shell: powershell
        run: .\tools\build-windows.ps1 -BuildDir build -Config Release
      - name: Run unit tests
        shell: powershell
        run: ctest --test-dir build -LE corpus --output-on-failure -j 4
      - name: Package release archive
        shell: powershell
        run: python tools/package.py --build build --platform windows --out out/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/release/*.zip

  linux:
    name: Package Linux (x86-64)
    needs: [hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build and SDL3 system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Configure and build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build -LE corpus --output-on-failure -j "$(nproc)"
      - name: Package release archive
        run: python3 tools/package.py --build build --platform linux --out out/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/release/*.zip

  macos:
    name: Package macOS (Apple Silicon)
    needs: [hygiene]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Ninja and MoltenVK
        run: brew install ninja molten-vk
      - name: Configure and build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(sysctl -n hw.ncpu)"
      - name: Run unit tests
        run: ctest --test-dir build -LE corpus --output-on-failure -j "$(sysctl -n hw.ncpu)"
      - name: Package Shift Engine.app with MoltenVK
        run: |
          MOLTENVK="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          test -f "$MOLTENVK"
          python3 tools/package.py --build build --platform macos --moltenvk "$MOLTENVK" --out out/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: out/release/*.zip

  android:
    name: Package Android (arm64 APK)
    needs: [hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Ninja and Android SDK/NDK components
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          else
            "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Configure and build Android arm64 libmain.so
        run: |
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DSHIFT_BUILD_LAUNCHER=OFF
          cmake --build build-android --target carview -j "$(nproc)"
      - name: Build APK and package release archive
        run: |
          python3 tools/android-apk.py --build build-android --out out/release
          python3 tools/package.py --build build-android --platform android --out out/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            out/release/*.zip
            out/release/shift-drive-arm64.apk

  publish:
    name: Checksums & publish release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          LC_ALL=C sha256sum *.zip *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/*.zip \
            release-assets/*.apk \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Shift Engine $RELEASE_TAG" \
            --generate-notes
